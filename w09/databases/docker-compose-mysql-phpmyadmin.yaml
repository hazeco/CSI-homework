# docker compose -f docker-compose-mysql-phpmyadmin.yaml up -d
# docker compose -f docker-compose-mysql-phpmyadmin.yaml down

networks:
  mysql-network:
    name: mysql-network

volumes:
  mysql_data:
    driver: local

services:
  mysql:
    image: mysql
    container_name: mysql
    restart: always
    ports:
      - 3307:3306
    volumes:
       - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: jwt
    networks:
      - mysql-network
      
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      PMA_HOSTS: mysql
      PMA_PORT: 3306
#      PMA_USER: root
#      PMA_PASSWORD: root
    networks:
      - mysql-network
